name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.health.outcome }}
    steps:
      - name: Check production routes
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for route in / /sms-opt-in; do
            curl --fail --silent --show-error \
              --max-time 20 --retry 2 --retry-delay 2 \
              "https://www.apptivity.online${route}" > /dev/null
          done

          redirect_headers="$(curl --silent --show-error --head --max-time 20 https://apptivity.online/)"
          grep -qE '^HTTP/[^ ]+ 308' <<< "$redirect_headers"
          grep -qiE '^location: https://www\.apptivity\.online/' <<< "$redirect_headers"

      - name: Open or update outage issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Production uptime check failed";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = data.find((issue) => !issue.pull_request && issue.title === title);
            const body = [
              `The scheduled production health check failed at ${new Date().toISOString()}.`,
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Check the Cloudflare Worker deployment, custom domains, DNS, and recent Worker logs.",
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail workflow when production is unhealthy
        if: steps.health.outcome == 'failure'
        run: exit 1
